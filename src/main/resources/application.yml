spring:
  application:
    name: kafka-poc
  ai:
    mcp:
      server:
        enabled: true
        name: kafka-poc-mcp-server
        version: 0.4.0
        type: SYNC
        instructions: >-
          MCP server exposing the tasks domain use cases (create, get, list,
          complete, archive) as tools. Callers must always provide a userId
          (UUIDv4) explicitly since there is no authenticated principal.
  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://localhost:27017/kafkapoc}
    representation:
      uuid: standard
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # Fail fast if the broker is unreachable instead of blocking the caller
        # for the default 2 minutes (delivery.timeout.ms).
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:kafka-poc}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # We use ByteArrayDeserializer at the Kafka client level and let Spring Kafka
      # convert the JSON payload into the listener's parameter type via the
      # JacksonJsonMessageConverter bean (declared in KafkaConsumerConfig).
      # This avoids the need for `__TypeId__` headers from the producer.
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    dev-user:
      id: ${APP_SECURITY_DEV_USER_ID:00000000-0000-0000-0000-000000000001}
